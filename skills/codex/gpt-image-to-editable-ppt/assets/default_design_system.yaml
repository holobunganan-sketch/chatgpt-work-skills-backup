version: 1
slide:
  ratio: "16:9"
  width_in: 13.333333
  height_in: 7.5
  background_color: "#FFFFFF"
  margin_left_in: 0.65
  margin_right_in: 0.65
  margin_top_in: 0.38
  margin_bottom_in: 0.45

typography:
  font_family: "Microsoft YaHei"
  default_text_color: "#000000"
  preferred_line_spacing: 1.5
  minimum_font_size_pt: 14
  title_font_size_pt: 28
  subtitle_font_size_pt: 20
  body_font_size_pt: 18
  caption_font_size_pt: 14
  title_bold: true

palette:
  background: "#FFFFFF"
  text: "#000000"
  primary: "#2F6B9A"
  primary_light: "#DCEAF7"
  secondary: "#4F8A7B"
  secondary_light: "#E2F1EC"
  accent: "#D29A42"
  accent_light: "#F7EDCF"
  alert: "#C65D5D"
  alert_light: "#F7E2E2"
  neutral_fill: "#F2F4F7"
  neutral_line: "#B8C0CC"

standard_content_layout:
  title_x_in: 0.65
  title_y_in: 0.34
  title_w_in: 12.03
  title_h_in: 0.52
  divider_x_in: 0.65
  divider_y_in: 1.12
  divider_w_in: 12.03
  divider_h_in: 0.0
  divider_color: "#2F6B9A"
  divider_width_pt: 1.5
  content_x_in: 0.65
  content_y_in: 1.36
  content_w_in: 12.03
  content_h_in: 5.69

layout_density:
  minimum_occupancy: 0.50
  preferred_occupancy: 0.68
  maximum_occupancy: 0.86
  maximum_text_area_ratio: 0.48
  minimum_gap_pt: 14
  preferred_content_blocks_min: 2
  preferred_content_blocks_max: 5

editability:
  require_native_text: true
  require_native_numbers: true
  require_native_basic_shapes: true
  require_native_tables: true
  require_native_data_charts: true
  allow_artistic_raster_assets: true
  forbid_full_slide_raster_by_default: true
